[pytest]
addopts = -v -ra --html=reports/report.html --self-contained-html
markers =
    smoke: Fast, critical checks
    content: Page content and consistency
    negative: Invalid input scenarios
    security: Basic passive security checks
    a11y: Accessibility checks
    responsive: Different screen sizes
    perf: Lightweight performance checks
    authenticated: Requires a real account (skipped by default)
